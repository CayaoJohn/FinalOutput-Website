<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .navbar {
            background: linear-gradient(to right, #0b5ed7, #0aa2c0);
        }

        body {
            background: linear-gradient(to right, #0d6efd, #0dcaf0);
            color: white;
        }

        .cart-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        thead {
            background: linear-gradient(to right, #0b5ed7, #0aa2c0);
            color: white;
        }

        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .content {
            flex: 1;
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 1.6rem;
            }

            .cart-box {
                padding: 15px;
            }

            table {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>

<div class="content">

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">

    <a class="navbar-brand fw-bold" href="homepage.html">KickZone</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse text-center" id="navbarNav">
      <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="products.html">Products</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="cart.html">Cart 🛒</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="about.html">About Us</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>

      </ul>
    </div>

  </div>
</nav>

<div class="container mt-5">

    <h1 class="text-center mb-4 fw-bold">Your Cart 🛒</h1>

    <div class="cart-box">
        <div class="table-responsive">
            <table class="table table-striped text-center">

                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>Nike Air Force 1</td>
                        <td>₱4,500</td>
                        <td>
                            <input type="number" value="1" class="form-control mx-auto" style="max-width: 70px;">
                        </td>
                        <td>₱4,500</td>
                        <td>
                            <button class="btn btn-danger btn-sm px-2">Remove</button>
                        </td>
                    </tr>

                    <tr>
                        <td>Nike Air Max 270</td>
                        <td>₱6,500</td>
                        <td>
                            <input type="number" value="1" class="form-control mx-auto" style="max-width: 70px;">
                        </td>
                        <td>₱6,500</td>
                        <td>
                            <button class="btn btn-danger btn-sm px-2">Remove</button>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>

        <div class="text-end mt-4">
            <h4 class="fw-bold text-dark">Total: ₱11,000</h4>
            <a href="products.html" class="btn btn-dark">Check Out</a>
        </div>

    </div>

</div>

</div>

<footer class="bg-dark text-white text-center p-3">
  <p>© 2026 KickZone | Contact: info@KickZone.com</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
